  # Tiny Tapeout project information
project:
  title:        "8:3 Priority Encoder"
  author:       "M Raghav Prasad"
  discord:      ""
  description:  "An 8-to-3 priority encoder that outputs the binary index of the highest-priority active input, with a valid flag"
  language:     "Verilog"
  clock_hz:     0

  tiles: "1x1"

  top_module:  "tt_um_tom"

  source_files:
    - "project.v"

pinout:
  # Inputs
  ui[0]: "in0 - encoder input 0"
  ui[1]: "in1 - encoder input 1"
  ui[2]: "in2 - encoder input 2"
  ui[3]: "in3 - encoder input 3"
  ui[4]: "in4 - encoder input 4"
  ui[5]: "in5 - encoder input 5"
  ui[6]: "in6 - encoder input 6"
  ui[7]: "in7 - encoder input 7 (highest priority)"

  # Outputs
  uo[0]: "enc0 - encoded output bit 0"
  uo[1]: "enc1 - encoded output bit 1"
  uo[2]: "enc2 - encoded output bit 2"
  uo[3]: "valid - high if any input is active"
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
